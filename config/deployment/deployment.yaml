# Deployment for the access VW server.
#
# Single-replica controller. The graph is in-memory, so running more
# than one replica gives every replica a separate view of the world
# and produces inconsistent SCAR responses depending on which pod
# fields the request. HA needs either a shared store (out of scope
# for the PoC) or fronting with a cache + leader election; for now,
# stick to one replica.
#
# Auth model: the server is a virtual-workspace root apiserver with
# standard delegated authentication. X-Remote-* identity headers are
# trusted only from callers presenting a client certificate signed by
# --requestheader-client-ca-file (kcp's FrontProxy); bearer tokens are
# validated via TokenReview against kcp. Serving is TLS-only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-vw
  labels:
    app.kubernetes.io/name: access-vw
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: access-vw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: access-vw
    spec:
      serviceAccountName: access-vw
      containers:
        - name: server
          image: ghcr.io/cnvergence/kcp-access-vw:latest
          imagePullPolicy: IfNotPresent
          args:
            - --secure-port=9443
            # Serving cert; must be verifiable by the FrontProxy's
            # backend_server_ca for the /services/access and
            # /services/mcp path mappings.
            - --tls-cert-file=/etc/access-vw/tls/tls.crt
            - --tls-private-key-file=/etc/access-vw/tls/tls.key
            # CA bundle that signed the FrontProxy's requestheader
            # client certificate; identity headers are only trusted
            # over mTLS with this CA.
            - --requestheader-client-ca-file=/etc/access-vw/requestheader-ca/ca.crt
            - --kubeconfig=/etc/kcp/kubeconfig/kubeconfig
            - --apiexport-endpointslice=access.kcp.io
            # endpoint-base must match the FrontProxy URL prefix used
            # to address bound workspaces. Set per-deployment.
            - --endpoint-base=https://kcp.example.com/clusters/
          ports:
            - name: https
              containerPort: 9443
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            periodSeconds: 30
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/kcp/kubeconfig
              readOnly: true
            - name: serving-cert
              mountPath: /etc/access-vw/tls
              readOnly: true
            - name: requestheader-ca
              mountPath: /etc/access-vw/requestheader-ca
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: kubeconfig
          secret:
            # Secret must contain a key "kubeconfig" pointing at the
            # access VW's APIExport virtual workspace. Generated when
            # the APIExport is created in kcp; export the relevant
            # workspace's kubeconfig with the system identity that
            # owns access.kcp.io.
            secretName: access-vw-kubeconfig
        - name: serving-cert
          secret:
            # kubernetes.io/tls secret with the VW's serving cert.
            secretName: access-vw-server
        - name: requestheader-ca
          secret:
            # Key "ca.crt": CA that signed the FrontProxy's
            # requestheader client certificate.
            secretName: access-vw-requestheader-ca
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: access-vw
---
apiVersion: v1
kind: Service
metadata:
  name: access-vw
  labels:
    app.kubernetes.io/name: access-vw
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: access-vw
  ports:
    - name: https
      port: 9443
      targetPort: https
