# RBAC for bob — read-only access in his workspace.
#
# Applied into root:bob-workspace during `make kind-setup`.
# Bob gets view + workspace-user (limited), while alice gets cluster-admin.
# The username is the OIDC format: issuer#subject
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workspace-user
rules:
  - apiGroups: ["tenancy.kcp.io"]
    resources: ["workspaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bob-viewer
subjects:
  - kind: User
    # OIDC username format from Keycloak
    name: "bob"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bob-workspace-user
subjects:
  - kind: User
    # OIDC username format from Keycloak
    name: "bob"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: workspace-user
  apiGroup: rbac.authorization.k8s.io
