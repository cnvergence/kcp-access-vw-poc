# Kubeconfig CR — kcp-operator generates a kubeconfig secret for the MCP server.
apiVersion: operator.kcp.io/v1alpha1
kind: Kubeconfig
metadata:
  name: mcp-server-kubeconfig
  namespace: kcp-system
spec:
  username: mcp-server
  groups:
    - system:kcp:admin
  validity: 8766h # 1 year
  secretRef:
    name: mcp-server-kubeconfig
  target:
    rootShardRef:
      name: root
