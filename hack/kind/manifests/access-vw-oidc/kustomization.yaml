# Optional overlay: enable local OIDC validation on access-vw.
#
# The base deployment trusts only X-Remote-* identity headers from the
# kcp front-proxy (requestheader mTLS). Apply this overlay when callers
# should be able to reach access-vw directly with a bearer token,
# bypassing the front-proxy (e.g. an AI gateway routing straight to the
# access-vw Service).
#
#   kubectl apply -k manifests/access-vw-oidc     # enable
#   kubectl apply -k manifests/access-vw          # disable (back to base)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kcp-system
resources:
  - ../access-vw
patches:
  - path: oidc-patch.yaml
    target:
      kind: Deployment
      name: access-vw
