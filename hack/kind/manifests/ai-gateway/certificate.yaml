# TLS certificate for the MCP Gateway.
# Provisioned for future HTTPS termination; the Gateway currently listens on
# plain HTTP (port 8080) so this secret is not yet referenced.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: mcp-selfsigned
  namespace: kcp-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mcp-gateway-tls
  namespace: kcp-system
spec:
  secretName: mcp-gateway-tls
  issuerRef:
    name: mcp-selfsigned
    kind: Issuer
  dnsNames:
    - mcp.kcp.example
  duration: 8760h
  renewBefore: 720h
