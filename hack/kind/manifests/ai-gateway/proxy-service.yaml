# Service in mcp namespace to proxy to access-vw in kcp-system.
# Uses EndpointSlice to point to access-vw's ClusterIP.
# Required because MCPRoute doesn't support cross-namespace backend references.
apiVersion: v1
kind: Service
metadata:
  name: access-vw-proxy
  namespace: mcp
spec:
  type: ClusterIP
  ports:
    - port: 9099
      targetPort: 9099
      protocol: TCP
---
# EndpointSlice pointing to access-vw service in kcp-system.
# We use the ClusterIP of access-vw service.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: access-vw-proxy-manual
  namespace: mcp
  labels:
    kubernetes.io/service-name: access-vw-proxy
addressType: IPv4
ports:
  - port: 9099
    protocol: TCP
endpoints:
  # This will be patched with the actual IP during setup
  - addresses:
      - "PLACEHOLDER"
    conditions:
      ready: true
