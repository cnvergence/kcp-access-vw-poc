# Backend for Keycloak JWKS endpoint.
# Required so Envoy can fetch JWT public keys for token validation.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: keycloak-jwks
  namespace: mcp
spec:
  endpoints:
    - fqdn:
        hostname: keycloak-keycloakx-http.keycloak.svc.cluster.local
        port: 80
