# MCPRoute for Envoy AI Gateway.
# Routes MCP traffic to access-vw MCP endpoint with Keycloak OAuth.
# Based on envoyproxy/ai-gateway/examples/mcp/mcp_oauth_keycloak.yaml
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPRoute
metadata:
  name: kcp-mcp
  namespace: kcp-system
spec:
  parentRefs:
    - name: kcp-mcp-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
  securityPolicy:
    oauth:
      issuer: "https://keycloak.kcp.example:8443/realms/kcp"
      jwks:
        remoteJWKS:
          # Use HTTP for JWKS fetch — Envoy doesn't have the Keycloak CA cert.
          # JWKS is public key material, safe over in-cluster HTTP.
          uri: http://keycloak-keycloakx-http.keycloak.svc.cluster.local/realms/kcp/protocol/openid-connect/certs
      protectedResourceMetadata:
        resource: "http://mcp.kcp.example:8080/mcp"
        scopesSupported:
          - openid
          - profile
          - email
  backendRefs:
    - name: access-vw
      kind: Service
      port: 9099
      path: /services/access-virtual-workspace/mcp
      forwardHeaders:
        - name: Authorization
---
# Gateway for MCP traffic
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: kcp-mcp
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kcp-mcp-gateway
  namespace: kcp-system
spec:
  gatewayClassName: kcp-mcp
  listeners:
    - name: mcp
      protocol: HTTP
      port: 8080
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: kcp-mcp-proxy
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: kcp-mcp-proxy
  namespace: kcp-system
spec:
  logging:
    level:
      default: info
  bootstrap:
    type: Merge
    value: |-
      admin:
        address:
          socket_address:
            address: 127.0.0.1
            port_value: 9901
  telemetry:
    accessLog:
      settings:
        - sinks:
            - type: File
              file:
                path: /dev/stdout
          format:
            type: JSON
            json:
              # MCP specific fields
              jsonrpc.request.id: "%DYNAMIC_METADATA(io.envoy.ai_gateway:mcp_request_id)%"
              mcp.session.id: "%REQ(MCP-SESSION-ID)%"
              mcp.method.name: "%DYNAMIC_METADATA(io.envoy.ai_gateway:mcp_method)%"
              mcp.tool.name: "%DYNAMIC_METADATA(io.envoy.ai_gateway:mcp_tool_name)%"
              mcp.provider.name: "%DYNAMIC_METADATA(io.envoy.ai_gateway:mcp_backend)%"
              # Common fields
              start_time: "%START_TIME%"
              method: "%REQ(:METHOD)%"
              x-envoy-origin-path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              protocol: "%PROTOCOL%"
              response_code: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              response_code_details: "%RESPONSE_CODE_DETAILS%"
              connection_termination_details: "%CONNECTION_TERMINATION_DETAILS%"
              upstream_transport_failure_reason: "%UPSTREAM_TRANSPORT_FAILURE_REASON%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              duration: "%DURATION%"
              x-envoy-upstream-service-time: "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
              x-forwarded-for: "%REQ(X-FORWARDED-FOR)%"
              user-agent: "%REQ(USER-AGENT)%"
              x-request-id: "%REQ(X-REQUEST-ID)%"
              ":authority": "%REQ(:AUTHORITY)%"
              upstream_host: "%UPSTREAM_HOST%"
              upstream_cluster: "%UPSTREAM_CLUSTER%"
              upstream_local_address: "%UPSTREAM_LOCAL_ADDRESS%"
              downstream_local_address: "%DOWNSTREAM_LOCAL_ADDRESS%"
              downstream_remote_address: "%DOWNSTREAM_REMOTE_ADDRESS%"
              requested_server_name: "%REQUESTED_SERVER_NAME%"
              route_name: "%ROUTE_NAME%"
