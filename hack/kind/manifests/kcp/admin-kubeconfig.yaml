# Kubeconfig CR — kcp-operator generates an admin kubeconfig for CLI use.
apiVersion: operator.kcp.io/v1alpha1
kind: Kubeconfig
metadata:
  name: kcp-admin-kubeconfig
  namespace: kcp-system
spec:
  username: kcp-admin
  groups:
    - system:kcp:admin
  validity: 8766h # 1 year
  secretRef:
    name: kcp-admin-kubeconfig
  target:
    rootShardRef:
      name: root
