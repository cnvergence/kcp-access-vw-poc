# FrontProxy CR for kcp-operator.
# Based on kcp-dev/kcp/contrib/tilt/ patterns.
apiVersion: operator.kcp.io/v1alpha1
kind: FrontProxy
metadata:
  name: frontproxy
  namespace: kcp-system
spec:
  image:
    repository: ghcr.io/kcp-dev/kcp
    tag: v0.31.2
  replicas: 1
  external:
    hostname: root.kcp.example
    port: 6443
  rootShard:
    ref:
      name: root
  auth:
    serviceAccount:
      enabled: true
    oidc:
      issuerURL: https://keycloak.kcp.example:8443/realms/kcp
      clientID: kcp
      usernameClaim: preferred_username
      usernamePrefix: "-"
      groupsClaim: groups
      groupsPrefix: "-"
      caFileRef:
        name: keycloak-ca
        key: ca.crt
  additionalPathMappings:
    # Both VWs served by the access-vw root apiserver (TLS, port 9443).
    # The front-proxy authenticates the caller (OIDC, client certs) and
    # forwards identity via X-Remote-* headers, authenticating itself to
    # the VW with its requestheader client cert.
    - path: /services/access
      backend: https://access-vw.kcp-system.svc.cluster.local:9443
      backend_server_ca: /etc/kcp/tls/ca/tls.crt
      proxy_client_cert: /etc/kcp-front-proxy/requestheader-client/tls.crt
      proxy_client_key: /etc/kcp-front-proxy/requestheader-client/tls.key
    - path: /services/mcp
      backend: https://access-vw.kcp-system.svc.cluster.local:9443
      backend_server_ca: /etc/kcp/tls/ca/tls.crt
      proxy_client_cert: /etc/kcp-front-proxy/requestheader-client/tls.crt
      proxy_client_key: /etc/kcp-front-proxy/requestheader-client/tls.key
