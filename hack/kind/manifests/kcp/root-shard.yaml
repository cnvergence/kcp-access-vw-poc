# RootShard CR for kcp-operator.
# Based on kcp-dev/kcp/contrib/tilt/shard-root.yaml
apiVersion: operator.kcp.io/v1alpha1
kind: RootShard
metadata:
  name: root
  namespace: kcp-system
spec:
  image:
    repository: ghcr.io/kcp-dev/kcp
    tag: v0.31.2
  proxy:
    image:
      repository: ghcr.io/kcp-dev/kcp
      tag: v0.31.2
  shardBaseURL: https://root-kcp.kcp-system.svc.cluster.local:6443
  external:
    hostname: root.kcp.example
    port: 6443
  certificates:
    issuerRef:
      group: cert-manager.io
      kind: Issuer
      name: selfsigned
  cache:
    embedded:
      enabled: true
  etcd:
    endpoints:
      - http://etcd.kcp-system.svc.cluster.local:2379
  auth:
    serviceAccount:
      enabled: true
    oidc:
      issuerURL: https://keycloak.kcp.example:8443/realms/kcp
      clientID: kcp
      usernameClaim: preferred_username
      usernamePrefix: "-"
      groupsClaim: groups
      groupsPrefix: ""
      caFileRef:
        name: keycloak-ca
        key: ca.crt
