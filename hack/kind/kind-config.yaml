apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
nodes:
  - role: control-plane
    extraPortMappings:
      # Keycloak HTTPS — keycloak.kcp.example:8443
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
        listenAddress: "127.0.0.1"
      # kcp FrontProxy — root.kcp.example:6443
      - containerPort: 30644
        hostPort: 6443
        protocol: TCP
        listenAddress: "127.0.0.1"
